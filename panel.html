<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de la hoja</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
      font: 15px/1.4 "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; }
    label { display: block; margin: 0 0 6px; font-weight: 600; }
    select {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      padding: 8px;
    }
    #estado { min-height: 3em; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Panel de la hoja</h1>
  <p>Bancos que devuelve la API, en el campo name.</p>
  <label for="bancos">Banco</label>
  <select id="bancos" disabled>
    <option value="">Cargando bancos…</option>
  </select>
  <p id="estado" role="status">Cargando Excel…</p>
  <script src="panel.js?v=bancos2"></script>
</body>
</html>
