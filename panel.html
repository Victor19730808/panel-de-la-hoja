<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de la hoja</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --azul: #0B3D6B;
      --acento: #1A7FC1;
      --claro: #E8F0F8;
      --gris: #5A6472;
      --tinta: #1E2430;
      --papel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--tinta);
      background: var(--claro);
      font: 15px/1.4 "Segoe UI", sans-serif;
    }
    .marca {
      background: var(--papel);
      padding: 18px 16px 14px;
      border-bottom: 3px solid var(--acento);
    }
    .logo {
      display: block;
      width: min(100%, 220px);
      height: auto;
    }
    .lema {
      margin: 8px 0 0;
      color: var(--gris);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .imagen {
      margin: 12px 16px 0;
      background: var(--papel);
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
    }
    .imagen img {
      display: block;
      width: 100%;
      height: 148px;
      object-fit: contain;
      object-position: center;
      background: var(--papel);
    }
    main {
      padding: 16px;
    }
    h1 {
      margin: 0 0 4px;
      color: var(--azul);
      font-size: 18px;
    }
    .ayuda {
      margin: 0 0 14px;
      color: var(--gris);
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-weight: 600;
    }
    select {
      width: 100%;
      font: inherit;
      color: var(--tinta);
      background: var(--papel);
      border: 1px solid #c5d4e4;
      border-radius: 8px;
      padding: 8px 10px;
    }
    select:focus {
      outline: 2px solid var(--acento);
      border-color: var(--acento);
    }
    select:disabled {
      color: var(--gris);
      background: #f4f7fb;
    }
    #estado {
      min-height: 3em;
      margin: 12px 0 0;
      color: var(--azul);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="marca">
    <img class="logo" src="logo-tedisa.png" alt="TEDISA">
    <p class="lema">Teleinformática Dinámica</p>
  </header>
  <figure class="imagen">
    <img src="mapa-tedisa.png" alt="Presencia de TEDISA en México">
  </figure>
  <main>
    <h1>Panel de la hoja</h1>
    <p class="ayuda">Bancos que devuelve la API, en el campo name.</p>
    <label for="bancos">Banco</label>
    <select id="bancos" disabled>
      <option value="">Cargando bancos…</option>
    </select>
    <p id="estado" role="status">Cargando Excel…</p>
  </main>
  <script src="panel.js?v=tedisa1"></script>
</body>
</html>
